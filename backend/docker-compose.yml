version: '3.8'

services:
  app:
    build: .
    container_name: rendezvous_backend
    restart: always
    ports:
      - "9501:9501" # Swoole WebSocket Server
      - "8000:8000" # REST API HTTP
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=rendezvous_db
      - DB_USERNAME=rendezvous_user
      - DB_PASSWORD=rendezvous_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=rendezvous_e2ee_jwt_ultra_secret_2026
      - GUIADEMOTEIS_API_KEY=gm_partner_prod_token_889210
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    container_name: rendezvous_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: rendezvous_db
      MYSQL_USER: rendezvous_user
      MYSQL_PASSWORD: rendezvous_secret
      MYSQL_ROOT_PASSWORD: rendezvous_root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  redis:
    image: redis:7-alpine
    container_name: rendezvous_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysqldata:
